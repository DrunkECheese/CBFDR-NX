name: Build Switch NRO

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct download URL to clean z64 ROM'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          dkp-pacman -Sy --noconfirm switch-dev switch-sdl2 switch-glad

      - name: Download ROM
        run: |
          mkdir -p game_rom
          curl -L "${{ github.event.inputs.rom_url }}" -o game_rom/baserom.us.z64

      - name: Compile Switch App
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake .. || true
          make -j$(nproc) || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: switch-build-output
          path: build/
          
